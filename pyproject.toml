[project]
name = "live-chat-system"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.163.2,<0.164.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.9,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pwdlib[argon2] (>=0.4.2,<0.5.0)",
    "email-validator (>=2.4.0,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "redis (>=8.2.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = ["B008"]